version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: vector_store_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: vector_store

  api:
    build: .
    container_name: vector_store_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=vector_store
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    depends_on:
      - mongodb
    volumes:
      - .:/app

volumes:
  mongodb_data: