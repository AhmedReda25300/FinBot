version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: vector_store_mongodb
    restart: always
    # FIX 1: Force MongoDB to listen on all interfaces so the API can reach it
    command: ["mongod", "--bind_ip_all", "--auth"]
    volumes:
      - mongodb_data:/data/db 
    environment:
      MONGO_INITDB_ROOT_USERNAME: finbot_admin
      # FIX 2: Use single quotes for the raw password (no URL encoding here)
      MONGO_INITDB_ROOT_PASSWORD: '8fJ9!kP2#vL4_xQ7'
      MONGO_INITDB_DATABASE: vector_store
    ports:
      - "27017:27017"

  api:
    build: .
    container_name: vector_store_api
    restart: always
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      # FIX 3: Keep URL encoded password here (%23 instead of #)
      # IF RUNNING INSIDE DOCKER use: mongodb
      - MONGO_URI=mongodb://finbot_admin:8fJ9%21kP2%23vL4_xQ7@mongodb:27017/vector_store?authSource=admin
      - DB_NAME=vector_store
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    depends_on:
      - mongodb
    security_opt:
      - no-new-privileges:true

volumes:
  mongodb_data: